name: mup-queue
services:
  db:
    restart: unless-stopped
    mem_limit: 384m
    image: postgres:16.15
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: ${DB_PASSWORD:-queue-local-development}
      POSTGRES_DB: queue
    volumes:
      - queue-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: mup-queue-backend:0.1.0
    build: ./backend
    environment: &app-env
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://queue:${DB_PASSWORD:-queue-local-development}@db:5432/queue
      DATA_DIR: /data
      ORIGIN: http://192.168.1.104:8088,https://mup.sklit.xyz,https://queue.sklit.xyz
      DOCUMENT_READER: tesseract
    volumes:
      - queue-files:/data
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m app.seed"]
  api:
    restart: unless-stopped
    mem_limit: 384m
    image: mup-queue-backend:0.1.0
    build: ./backend
    environment: *app-env
    volumes:
      - queue-files:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    restart: unless-stopped
    mem_limit: 384m
    image: mup-queue-backend:0.1.0
    build: ./backend
    environment: *app-env
    volumes:
      - queue-files:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "app.worker"]
  web:
    restart: unless-stopped
    mem_limit: 96m
    image: mup-queue-web:0.1.0
    build: ./frontend
    ports:
      - "192.168.1.104:8088:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  queue-db:
  queue-files:
