[project]
name = "mup-queue"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.2", "uvicorn==0.54.0", "sqlalchemy==2.1.4",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "pydantic-settings==2.16.0",
  "python-multipart==0.0.32", "cryptography==50.0.2", "pillow==12.3.0",
  "pytesseract==0.3.13", "argon2-cffi==25.1.0", "httpx==0.28.1"
]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
